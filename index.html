<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracking Error</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#141416">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Arimo:wght@400;700&display=swap">

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<style>
/* Layout: a CRT set on a dark bezel. Guide view = preview window + clock on top, crawling channel grid below; remote strip under the set. */
:root{
  --bezel:#141416; --bezel-hi:#2a2a2f; --plastic:#1f1f23;
  --navy-1:#0b1d78; --navy-2:#050f45;
  --cell:#1b34a6; --cell-hi:#2a48c8; --line:#a8e6ff;
  --bev-l:#8fb6ff; --bev-d:#061048;
  --ch-a:#6e1131; --ch-b:#4a1a7c; --ch-c:#0d6363;
  --movie:#1d7a33; --sport:#a2221f; --kids:#9a7a07; --prem:#5a2a97;
  --text:#ffffff; --text-y:#fff3a6; --hl:#ffb300; --ok:#38d26b;
  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --body:"Arimo",Arial,Helvetica,sans-serif;
  --rowh:46px; --chw:78px;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bezel);color:var(--text);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  overflow:hidden;-webkit-font-smoothing:none;font-smooth:never;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.tv{height:100%;display:flex;flex-direction:column;gap:10px;max-width:1100px;margin:0 auto}
.screen{flex:1;min-height:0;position:relative;border-radius:22px/18px;overflow:hidden;
  background:linear-gradient(180deg,var(--navy-1),var(--navy-2));
  box-shadow:0 0 0 3px #000,0 0 0 9px var(--bezel-hi),0 0 40px rgba(60,110,255,.25) inset}
.overscan{position:absolute;inset:-1.2%;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column}

/* CRT texture */
.crt{position:absolute;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),
             radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.crt::after{content:"";position:absolute;left:0;right:0;height:18%;top:-20%;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.06),transparent);animation:roll 9s linear infinite}
@keyframes roll{0%{top:-20%}70%{top:-20%}100%{top:110%}}

/* Text treatment */
.sh{text-shadow:2px 2px 0 #000,0 0 5px rgba(255,255,255,.35)}
.bevel{border:2px solid;border-color:var(--bev-l) var(--bev-d) var(--bev-d) var(--bev-l)}

/* Top half */
.top{flex:0 0 40%;min-height:0;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:10px;padding:14px 16px 8px}
.preview{position:relative;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}
.promo{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:10px;gap:4px;
  background:linear-gradient(160deg,#16257f,#3a0b4a)}
.promo .k{font:12px var(--display);letter-spacing:.18em;color:var(--hl)}
.promo .t{font:clamp(16px,3.4vw,30px)/1.05 var(--display);letter-spacing:.06em;text-transform:uppercase}
.promo .s{font:700 clamp(11px,1.8vw,15px) var(--body);letter-spacing:.1em;color:var(--text-y)}
.preview iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.logo{display:flex;align-items:center;gap:8px;background:var(--ch-a);padding:6px 10px}
.logo b{font:clamp(22px,4vw,40px)/1 var(--display);color:var(--hl);text-shadow:3px 3px 0 #000}
.logo span{font:clamp(11px,1.7vw,16px)/1.05 var(--display);letter-spacing:.14em}
.clock{flex:1;display:flex;align-items:center;justify-content:center;background:#000;
  font:clamp(26px,6.2vw,64px)/1 var(--display);letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--text)}
.wx{display:flex;align-items:center;gap:8px;background:var(--ch-c);padding:5px 10px;font:700 clamp(12px,1.8vw,16px) var(--body);letter-spacing:.1em}
.sun{width:18px;height:18px;border-radius:50%;background:#ffd23a;box-shadow:0 0 0 3px rgba(255,210,58,.35)}

/* Grid */
.ghead{display:grid;grid-template-columns:var(--chw) 1fr 1fr 1fr;background:#000;border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
.ghead div{font:13px var(--display);letter-spacing:.12em;padding:5px 8px;border-left:1px solid #334}
.ghead div:first-child{border-left:0;color:var(--hl)}
.gview{flex:1;min-height:0;overflow:hidden;position:relative}
.gview.static{overflow-y:auto}
.gcontent{will-change:transform}
.gview.flick .gcontent{animation:flick .14s steps(2)}
@keyframes flick{50%{opacity:.25}}
.row{display:grid;grid-template-columns:var(--chw) 1fr;height:var(--rowh);border-bottom:1px solid #06103a}
.chcell{display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
  border:2px solid;border-color:rgba(255,255,255,.45) rgba(0,0,0,.6) rgba(0,0,0,.6) rgba(255,255,255,.45)}
.chcell b{font:20px/1 var(--display)}
.chcell span{font:700 11px var(--body);letter-spacing:.12em}
.track{position:relative}
.cell{position:absolute;top:2px;bottom:2px;background:var(--cell);border:1px solid;border-color:var(--line) var(--bev-d) var(--bev-d) var(--line);
  padding:3px 6px;overflow:hidden;white-space:nowrap;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:2px}
.cell .t{display:block;overflow:hidden;font:700 14px/1.1 var(--body);letter-spacing:.07em}
.cell .tg{display:flex;gap:3px;align-items:center;font:700 9px var(--body);letter-spacing:.06em;color:var(--text-y)}
.tag{border:1px solid currentColor;padding:0 3px;line-height:12px}
.tag.new{background:var(--hl);color:#000;border-color:var(--hl);text-shadow:none}
.arr{color:var(--hl);margin-right:4px}
.arr.r{margin:0 0 0 4px}
.k-movie{background:var(--movie)} .k-sports{background:var(--sport)} .k-kids{background:var(--kids)}
.prem .cell{background:var(--prem)}
.ppvp{color:var(--hl)}
.cell.sel{outline:4px solid var(--hl);outline-offset:-3px;z-index:3}
.adrow{height:var(--rowh);display:flex;align-items:center;justify-content:center;gap:10px;padding:0 12px;text-align:center;
  background:var(--ch-a);border-block:2px solid var(--line);font:clamp(12px,1.9vw,16px) var(--display);letter-spacing:.1em;color:var(--text-y)}
.adrow.up{background:#000;color:var(--hl)}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* Remote */
.remote{flex:none;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:8px;border-radius:14px;background:var(--plastic);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 0 #000}
.rb{min-width:44px;height:40px;padding:0 10px;border-radius:9px;border:0;background:#33333a;cursor:pointer;
  font:12px var(--display);letter-spacing:.08em;box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 3px 0 #000}
.rb:active{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 1px 0 #000}
.rb.on{background:var(--hl);color:#000}
.rb.okb{background:#4a4a54}
.rb:focus-visible,.btn:focus-visible,.cell:focus-visible{outline:3px solid var(--hl);outline-offset:2px}

/* Overlays */
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,20,.55)}
.panel{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--navy-1);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.panel .ph{font:700 12px var(--body);letter-spacing:.14em;color:var(--text-y)}
.panel h2{margin:0;font:clamp(20px,3.6vw,30px)/1.05 var(--display);letter-spacing:.05em;text-transform:uppercase;text-wrap:balance}
.panel .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font:700 13px var(--body);letter-spacing:.08em}
.panel p{margin:0;font:15px/1.4 var(--body);max-width:60ch}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{padding:8px 14px;background:var(--cell-hi);cursor:pointer;font:13px var(--display);letter-spacing:.1em;border:2px solid;border-color:var(--bev-l) var(--bev-d) var(--bev-d) var(--bev-l)}
.btn.go{background:var(--movie)}
.btn.dim{background:#2b2f55;color:#9aa3d6}
.btn:disabled{cursor:default}
.inline{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
select,input,textarea{font:14px var(--body);background:#000;color:#fff;border:2px solid;border-color:var(--bev-d) var(--bev-l) var(--bev-l) var(--bev-d);padding:6px;min-width:0}
textarea{width:100%;resize:vertical}

/* Player */
#player{background:#000;padding:0;flex-direction:column}
#media{position:relative;flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center}
#media iframe,#media video{width:100%;height:100%;border:0;background:#000}
.bars{position:absolute;inset:0;display:flex;flex-direction:column}
.bars .c{flex:1;display:flex}
.bars .c i{flex:1}
.bars .msg{position:absolute;inset:auto 0 18%;margin:auto;width:min(420px,86%);background:#000;padding:12px 14px;text-align:center;display:flex;flex-direction:column;gap:6px}
.bars .msg b{font:22px var(--display);letter-spacing:.12em}
.bars .msg span{font:14px/1.35 var(--body)}
.osd{position:absolute;top:16px;left:20px;z-index:4;display:flex;align-items:baseline;gap:10px;color:var(--ok);font:44px/1 var(--display);text-shadow:3px 3px 0 #000;transition:opacity .3s}
.osd span{font-size:18px;letter-spacing:.12em}
.osd.fade{opacity:0}
.pbar{width:100%;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:10px 14px;background:linear-gradient(180deg,#0b1d78,#050f45);border-top:2px solid var(--line)}
.pinfo{min-width:0;display:flex;flex-direction:column;gap:2px}
.pinfo b{font:16px var(--display);letter-spacing:.08em;text-transform:uppercase;overflow:hidden;white-space:nowrap}
.pinfo span{font:700 12px var(--body);letter-spacing:.1em;color:var(--text-y)}
.pinfo a{color:var(--line);font:700 12px var(--body)}
.live{background:var(--sport);padding:0 5px;margin-right:6px;color:#fff}

/* On Demand */
.odhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;background:#000;border-bottom:2px solid var(--line)}
.odhead .logo{background:transparent;padding:0}
.odhead .clk{font:clamp(18px,3vw,26px) var(--display);font-variant-numeric:tabular-nums}
.odbody{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 18px;display:flex;flex-direction:column;gap:14px}
.hero{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr);gap:14px;align-items:center;background:rgba(0,0,0,.35);padding:12px}
.hero h2{margin:0;font:clamp(22px,4vw,38px)/1 var(--display);text-transform:uppercase;letter-spacing:.04em;text-wrap:balance}
.hero p{margin:6px 0;font:15px/1.4 var(--body);max-width:60ch}
.odbody>*{flex-shrink:0}
.shelfh{margin:0;font:15px var(--display);letter-spacing:.16em;color:var(--hl)}
.shelf{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.box{flex:0 0 118px;scroll-snap-align:start;cursor:pointer;border:0;padding:0;background:none;text-align:left;display:flex;flex-direction:column;gap:4px}
.poster{aspect-ratio:2/3;max-width:100%;width:100%;position:relative;overflow:hidden;
  background:linear-gradient(180deg,hsl(var(--h) 65% 38%),hsl(var(--h) 70% 14%));
  border:2px solid;border-color:rgba(255,255,255,.5) rgba(0,0,0,.7) rgba(0,0,0,.7) rgba(255,255,255,.5);
  display:flex;flex-direction:column;justify-content:flex-end;padding:8px}
.poster::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 8px,transparent 8px 16px)}
.poster b{position:relative;font:15px/1.05 var(--display);text-transform:uppercase;letter-spacing:.03em;text-shadow:2px 2px 0 #000;overflow-wrap:anywhere}
.poster i{position:relative;font:700 11px var(--body);font-style:normal;letter-spacing:.1em;color:var(--text-y)}
.badge{position:absolute;top:6px;left:6px;font:700 9px var(--body);letter-spacing:.1em;padding:1px 4px;background:#000;color:var(--text-y);z-index:1}
.badge.rdy{background:var(--ok);color:#000}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.poster .badge{z-index:3}
.badge.vhs{background:#000;color:var(--hl)} .badge.dvd{background:#e8e8f0;color:#111}
.hero p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.credits{margin:0;font:13px/1.4 var(--body);color:#c9d2ff;max-width:60ch}
.imp{background:rgba(255,179,0,.08);border:2px dashed var(--hl);padding:10px;display:flex;flex-direction:column;gap:8px}
.box small{font:700 11px var(--body);letter-spacing:.06em;color:#c9d2ff}

/* Setup */
.setup{width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--navy-2);padding:0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px;background:#000;align-items:center}
.tab{padding:6px 10px;border:0;background:#22264f;cursor:pointer;font:12px var(--display);letter-spacing:.1em;text-transform:uppercase}
.tab.on{background:var(--hl);color:#000}
.tabs .x{margin-left:auto}
.sbody{overflow-y:auto;padding:12px 14px 18px;display:flex;flex-direction:column;gap:14px;font-size:14px}
.sbody h3{margin:0;font:14px var(--display);letter-spacing:.14em;color:var(--hl)}
.note{margin:0;color:#c9d2ff;font:13px/1.45 var(--body);max-width:65ch}
.chsec{background:rgba(255,255,255,.04);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.chhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chhead b{font:18px var(--display)}
.chhead em{font-style:normal;color:#c9d2ff;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.list li{display:flex;align-items:center;gap:6px;min-width:0}
.list li .nm{flex:1;min-width:0;text-align:left;background:none;border:0;cursor:pointer;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:underline dotted;padding:2px 0}
.list li span{color:#c9d2ff;font-size:12px;font-variant-numeric:tabular-nums}
.sm{border:0;background:#22264f;cursor:pointer;padding:3px 7px;font-size:12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.form label{display:flex;flex-direction:column;gap:2px;font:700 11px var(--body);letter-spacing:.08em;color:#c9d2ff;text-transform:uppercase}
.form .wide{grid-column:1/-1}
.form .chk{flex-direction:row;align-items:center;gap:6px}

.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;background:#000;border:2px solid var(--hl);padding:8px 14px;
  font:13px var(--display);letter-spacing:.08em;max-width:90%;text-align:center}
.remind{position:absolute;left:0;right:0;top:0;z-index:30;background:var(--hl);color:#000;padding:8px 14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font:13px var(--display);letter-spacing:.06em}
.remind .btn{color:#fff}

@media (max-width:620px){
  :root{--chw:58px;--rowh:44px}
  .top{flex-basis:34%;padding:10px 12px 6px;gap:8px}
  .cell .t{font-size:12px}
  .chcell b{font-size:16px}
  .ghead div{font-size:11px;padding:4px 5px}
  .rb{min-width:40px;height:38px;padding:0 8px;font-size:11px}
  .hero{grid-template-columns:minmax(0,96px) minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  .crt::after,.blink{animation:none}
  .gview.flick .gcontent{animation:none}
}
</style>
</head>
<body>

<div class="tv">
  <div class="screen" id="screen">
    <div class="overscan">
      <section class="view" id="guideView">
        <div class="top">
          <div class="preview bevel" id="preview"></div>
          <div class="side">
            <div class="logo bevel"><b>3</b><span>TRACKING<br>ERROR</span></div>
            <div class="clock bevel sh" id="clock">--:-- --</div>
            <div class="wx bevel sh" id="wx"><span class="sun"></span><span id="wxText"></span></div>
          </div>
        </div>
        <div class="ghead sh" id="ghead"></div>
        <div class="gview" id="gview"><div class="gcontent sh" id="gcontent"></div></div>
      </section>
      <section class="view" id="odView" hidden></section>
    </div>
    <div class="overlay" id="info" hidden></div>
    <div class="overlay" id="player" hidden>
      <div class="osd" id="osd"></div>
      <div id="media"></div>
      <div class="pbar sh">
        <div class="pinfo" id="pinfo"></div>
        <div class="btns" id="pbtns"></div>
      </div>
    </div>
    <div class="overlay" id="setup" hidden></div>
    <div class="remind" id="remind" hidden></div>
    <div class="toast" id="toast" hidden></div>
    <div class="crt"></div>
  </div>
  <nav class="remote" aria-label="Remote control">
    <button class="rb on" id="bGuide">GUIDE</button>
    <button class="rb" id="bOD">ON DEMAND</button>
    <button class="rb" data-k="ArrowLeft" aria-label="Left">◀</button>
    <button class="rb" data-k="ArrowUp" aria-label="Up">▲</button>
    <button class="rb okb" data-k="Enter">OK</button>
    <button class="rb" data-k="ArrowDown" aria-label="Down">▼</button>
    <button class="rb" data-k="ArrowRight" aria-label="Right">▶</button>
    <button class="rb" data-k="PageUp">PG▲</button>
    <button class="rb" data-k="PageDown">PG▼</button>
    <button class="rb" id="bSound" aria-label="Sound">♪</button>
    <button class="rb" id="bSetup">SETUP</button>
  </nav>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const MIN=60000, ANCHOR=new Date(2026,0,1).getTime();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LS='channel3-data-v1';

/* ---------- sample data (replace in SETUP) ---------- */
function P(title,kind,mins,rating,year,stars,desc,extra){return Object.assign({id:uid(),title,kind,mins,rating,year,stars,desc,cc:true,isNew:false,src:''},extra||{})}
function sample(){
  const movies=[
    P('Twister','movie',113,'PG-13',1996,3,'Storm chasers race across Oklahoma to put a sensor package inside a tornado.',{genre:'Action'}),
    P('Jurassic Park','movie',127,'PG-13',1993,3.5,'A theme park of cloned dinosaurs loses power during a preview tour.',{genre:'Sci-Fi'}),
    P('Independence Day','movie',145,'PG-13',1996,3,'Giant alien ships park over the world’s cities on the eve of July 4th.',{genre:'Sci-Fi'}),
    P('The Rock','movie',136,'R',1996,3,'A chemist and a former prisoner break into Alcatraz to stop a rogue general.',{genre:'Action'}),
    P('Batman Forever','movie',121,'PG-13',1995,2.5,'Batman takes on Two-Face and the Riddler while a new partner joins him.',{genre:'Action'}),
    P('Home Alone','movie',103,'PG',1990,3,'Left behind over Christmas, an 8-year-old defends his house from two burglars.',{genre:'Family'}),
    P('Toy Story','movie',81,'G',1995,4,'A cowboy doll feels pushed aside when a space-ranger toy arrives.',{genre:'Family'}),
    P('Space Jam','movie',88,'PG',1996,2.5,'Michael Jordan joins the Looney Tunes for a game against alien invaders.',{genre:'Family'}),
    P('The Mask','movie',101,'PG-13',1994,3,'A mild bank clerk finds a wooden mask that turns him into a living cartoon.',{genre:'Comedy'}),
    P('Men in Black','movie',98,'PG-13',1997,3.5,'A rookie joins a secret agency that polices aliens living on Earth.',{genre:'Sci-Fi'})
  ];
  const cp=t=>{const m=movies.find(x=>x.title===t);return Object.assign({},m,{id:uid()})};
  return {
    settings:{town:'Plainfield',temp:62,promo:'',sound:false},
    guideAds:['Call 1-800-CABLE-TV to order HBO!','Pay-Per-View • Channel 45 • $3.99','Add your own shows & commercials in SETUP'],
    ads:[],
    reminders:[],
    movies,

function segs(ch,t0,t1){
  const it=ch.items; if(!it.length) return [];
  const cyc=it.reduce((s,p)=>s+slot(p),0);
  let t=t0-(((t0-ANCHOR)%cyc)+cyc)%cyc, i=0; const out=[];
  while(t<t1&&i<5000){const p=it[i%it.length],len=slot(p);if(t+len>t0)out.push({p,start:t,end:t+len,ch});t+=len;i++}

const player=$('#player'),media=$('#media');

function mount(src,startSec,isLive){

  if(id){media.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0&start=${startSec}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Video"></iframe>`;return `https://www.youtube.com/watch?v=${id}&t=${startSec}s`}

/* A slot = acts of the show with commercial breaks between them, plus a closing break.
   Premium/PPV channels (and ones marked commercial-free) run uninterrupted. */
const adFree=ch=>ch.cat==='premium'||!!ch.ppv||!!ch.noAds;
function pieces(s){
  const p=s.p,S=(s.end-s.start)/1000,R=Math.min((+p.mins||30)*60,S),G=Math.max(0,S-R),cuts=[];
  if(!adFree(s.ch)&&G>=30){const acts=p.kind==='movie'?Math.max(1,Math.round(R/1500)):(R<=2400?3:Math.max(2,Math.round(R/900)));for(let i=1;i<acts;i++)cuts.push(R*i/acts)}
  const each=cuts.length?G*0.6/cuts.length:0,out=[];let pos=0,t=0;
  cuts.forEach((c,i)=>{out.push({type:'show',from:pos,len:c-pos,at:t,act:i+1});t+=c-pos;pos=c;out.push({type:'break',len:each,at:t});t+=each});
  out.push({type:'show',from:pos,len:R-pos,at:t,act:cuts.length+1});t+=R-pos;
  if(S-t>0.5)out.push({type:'break',len:S-t,at:t,last:true});

function playLive(chId,cont){
  clearTimeout(pTimer);const ch=chById(chId);if(!ch)return;
  if(!cont||curCh!==chId)showOSD(ch);curCh=chId;openPlayer();
  const now=Date.now(),s=nowOn(ch);
  if(!s){card('NO SIGNAL','This channel has no programs yet.');setBar(ch.call,'CH '+ch.num,null,true);return}
  const off=(now-s.start)/1000,pcs=pieces(s);
  const pc=pcs.find(x=>off>=x.at&&off<x.at+x.len)||pcs[pcs.length-1];
  const into=off-pc.at,left=Math.max(1,pc.len-into),next=()=>playLive(chId,true),where='CH '+ch.num+' '+ch.call;
  if(pc.type==='show'){
    const link=mount(s.p.src,pc.from+into,true);
    if(!link) card('NO SIGNAL','No video linked to “'+(s.p.desc&&s.p.title==='The Simpsons'?s.p.desc:s.p.title)+'” yet. The schedule keeps running — add a link in SETUP.');
    setBar(label(s.p),where+' • until '+fmt(s.end)+(s.p.desc&&s.p.desc.length<60?' • '+s.p.desc:''),link,true);
    pTimer=setTimeout(next,left*1000+300);return;
  }
  const backAt=s.start+(pc.at+pc.len)*1000,back=pc.last?'up next at '+fmt(backAt):'back at '+fmt(backAt);
  const ads=D.ads.filter(a=>a.src&&a.type!=='bumper'),bums=D.ads.filter(a=>a.src&&a.type==='bumper');
  if(!ads.length&&!bums.length){
    card(pc.last?'STAY TUNED':'WE’LL BE RIGHT BACK','Commercial break — '+back+'. Import commercials in SETUP → Archive to fill these.');
    setBar('Commercial Break',where+' • '+back,null,true);pTimer=setTimeout(next,left*1000+300);return;
  }
  // same break always plays the same lineup; different breaks rotate through the pool
  const seed=Math.floor((s.start+pc.at*1000)/60000)*7,L=a=>+a.secs||30,pick=(arr,k)=>arr[(seed+k)%arr.length];
  const seq=[],tail=bums.length?pick(bums,1):null,tailLen=tail?L(tail):0;let sum=0,k=0;
  if(bums.length){seq.push(pick(bums,0));sum+=L(seq[0])}
  const fill=ads.length?ads:bums;
  while(sum<pc.len-tailLen&&k<300){const a=pick(fill,k++);seq.push(a);sum+=L(a)}
  if(tail&&sum<pc.len)seq.push(tail);
  let t=0;
  for(const a of seq){if(into<t+L(a)){const link=mount(a.src,into-t,true);
    setBar(a.title||'Commercial',where+' • '+back,link,true);
    pTimer=setTimeout(next,Math.min(t+L(a)-into,left)*1000+300);return}t+=L(a)}

}
function surf(dir){const list=chs();if(!list.length)return;let i=list.findIndex(c=>c.id===curCh);i=(i+dir+list.length)%list.length;playLive(list[i].id)}

/* ---------- import from The Archive ---------- */
const SAMPLE_TITLES=['Twister','Jurassic Park','Independence Day','The Rock','Batman Forever','Home Alone','Toy Story','Space Jam','The Mask','Men in Black'];
const isSample=m=>!m.arc&&!m.mine&&SAMPLE_TITLES.includes(m.title);
const GENRE_NAMES={'Science Fiction':'Sci-Fi','Action & Adventure':'Action','Kids':'Family'};
function mins(rt){const s=String(rt||''),h=+(s.match(/(\d+)\s*h/i)||[])[1]||0,m=+(s.match(/(\d+)\s*m/i)||[])[1]||0;return h*60+m||+s||0}
function shelfFor(x){
  const words=[...(x.tags||[]),...(x.genres||[])].join(' ');
  if(/christmas|holiday|halloween|pumpkin|santa/i.test(words+' '+x.title)) return 'Holiday';
  if(x.mediaType==='tv') return 'TV Shows';
  const g=(x.genres||[]).find(g=>g!=='TV Movie');
  return GENRE_NAMES[g]||g||'Movies';
}
function importArchive(arr,clearSamples){
  if(!Array.isArray(arr)) arr=arr.items||arr.collection||arr.media;
  if(!Array.isArray(arr)||!arr.length||!arr[0].title) throw new Error('not archive');
  if(clearSamples) D.movies=D.movies.filter(m=>!isSample(m));
  // fold duplicate copies (e.g. a VHS and a DVD of the same title) into one entry
  const groups=new Map();
  arr.forEach(x=>{if(!x||!x.title)return;const k=[x.title,x.year,x.season||''].join('|').toLowerCase();if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)});
  let added=0,updated=0;
  groups.forEach(list=>{
    const x=list[0],formats=[...new Set(list.map(i=>i.format).filter(Boolean))];
    const data={arc:x.id,title:x.title+(x.season&&x.mediaType==='tv'?' — '+x.season:''),year:x.year||'',genre:shelfFor(x),rating:x.rating||'',
      mins:mins(x.runtime),stars:+x.myRating||0,desc:x.plot||'',poster:x.posterUrl||'',trailer:x.trailer||'',format:formats.join(' + '),
      director:x.director||'',cast:(x.cast||[]).slice(0,6),added:x.dateAdded||0,kind:'movie',cc:true,isNew:false};
    const ids=list.map(i=>i.id);
    const ex=D.movies.find(m=>m.arc&&ids.includes(m.arc));
    if(ex){Object.assign(ex,data,{src:ex.src||''});updated++}
    else{D.movies.push(Object.assign({id:uid(),src:''},data));added++}
  });
  feat=0;
  return {added,updated};
}

/* ---------- Internet Archive ---------- */
let IA={url:'',id:'',title:'',clips:[],busy:false,err:'',as:'commercial'};
const dur=s=>{s=Math.round(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
function secsOf(v){if(v==null)return 0;const s=String(v);if(s.includes(':'))return s.split(':').reduce((t,n)=>t*60+(+n||0),0);return +s||0}
const iaId=u=>{u=String(u||'').trim();const m=u.match(/archive\.org\/(?:details|download|embed|stream)\/([^/?#\s]+)/i);return m?decodeURIComponent(m[1]):(/^[\w.-]+$/.test(u)?u:'')};
async function iaLookup(url){
  const id=iaId(url);IA={...IA,url,id,clips:[],err:'',busy:true};renderSetup();
  if(!id){IA.busy=false;IA.err='That doesn\u2019t look like an archive.org link. It should look like archive.org/details/something.';return renderSetup()}
  try{
    const r=await fetch('https://archive.org/metadata/'+encodeURIComponent(id));
    const j=await r.json();if(!j||!j.files||!j.files.length)throw new Error('empty');
    const files=j.files,vid=/\.(mp4|m4v|webm|ogv|mov|mpe?g|avi|mkv|wmv|flv)$/i,play=/\.(mp4|m4v|webm)$/i;
    const originals=files.filter(f=>f.source==='original'&&vid.test(f.name));
    const pickFor=o=>play.test(o.name)&&!/\.mov$/i.test(o.name)?o:files.filter(f=>f.source==='derivative'&&f.original===o.name&&/\.mp4$/i.test(f.name)).sort((a,b)=>(/\.ia\.mp4$/i.test(a.name)?1:0)-(/\.ia\.mp4$/i.test(b.name)?1:0))[0];
    let list=originals.map(o=>{const f=pickFor(o);return f&&{f,o}}).filter(Boolean);
    if(!list.length) list=files.filter(f=>play.test(f.name)).map(f=>({f,o:f}));
    const seen=new Set();
    IA.clips=list.filter(({f})=>!seen.has(f.name)&&seen.add(f.name)).map(({f,o})=>({
      title:(o.title||f.title||o.name.replace(/^.*\//,'').replace(/\.[^.]+$/,'')).replace(/[_]+/g,' ').trim(),
      secs:secsOf(o.length)||secsOf(f.length),
      url:'https://archive.org/download/'+encodeURIComponent(id)+'/'+f.name.split('/').map(encodeURIComponent).join('/'),on:true}))
      .sort((a,b)=>a.title.localeCompare(b.title,undefined,{numeric:true}));
    const t=j.metadata&&j.metadata.title;IA.title=Array.isArray(t)?t[0]:(t||id);
    if(!IA.clips.length) IA.err='That upload has no playable videos.';
  }catch(e){IA.err='Couldn\u2019t reach the Internet Archive. If you\u2019re in Claude\u2019s preview, outside sites are blocked \u2014 this works on the live site. Otherwise check the link and try again.'}
  IA.busy=false;renderSetup();
}
function iaImport(f){
  const picks=IA.clips.filter(c=>c.on);let n=0;
  if(f.as==='commercial'||f.as==='bumper') picks.forEach(c=>{if(!D.ads.some(a=>a.src===c.url)){D.ads.push({title:c.title,src:c.url,secs:c.secs||30,type:f.as,from:IA.id});n++}});
  else if(f.as==='episode'){const ch=chById(f.ch);if(!ch)return 0;picks.forEach(c=>{ch.items.push({id:uid(),title:f.series.trim()||c.title,kind:f.kind,mins:(c.secs||1320)/60,rating:f.rating.trim(),year:'',stars:0,desc:c.title,cc:true,isNew:false,src:c.url});n++})}
  else picks.forEach(c=>{if(!D.movies.some(m=>m.src===c.url)){D.movies.push({id:uid(),mine:true,title:c.title,year:'',genre:f.genre.trim()||'Movies',rating:'',mins:(c.secs||0)/60,stars:0,desc:'From the Internet Archive: '+IA.title,src:c.url,format:'Archive',kind:'movie',cc:true,isNew:false});n++}});
  return n;
}

    else if(IA.err) b+=`<p class="note" style="color:var(--hl)">${esc(IA.err)}</p>`;
    else if(IA.clips.length){
      const n=IA.clips.filter(c=>c.on).length,tot=IA.clips.filter(c=>c.on).reduce((t,c)=>t+c.secs,0);
      b+=`<div class="chsec"><div class="chhead"><span style="font-weight:700">${esc(IA.title)}</span><em>${IA.clips.length} videos</em><button class="sm" style="margin-left:auto" data-iaall>${n===IA.clips.length?'Select none':'Select all'}</button></div>
        <ol class="list" style="max-height:240px;overflow-y:auto">${IA.clips.map((c,i)=>`<li><label style="display:flex;gap:6px;align-items:center;flex:1;min-width:0"><input type="checkbox" data-iac="${i}" ${c.on?'checked':''}><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff">${esc(c.title)}</span></label><span>${dur(c.secs)}</span></li>`).join('')}</ol></div>
        <form class="form" id="fIAimp">
          <label>Import as<select name="as" id="iaAs">${[['commercial','Commercials'],['bumper','Station IDs & bumpers'],['episode','Show episodes'],['movie','Movies (On Demand)']].map(([v,l])=>opt(v,IA.as,l)).join('')}</select></label>
          ${IA.as==='episode'?`<label>Channel<select name="ch" id="iaCh">${chs().map(c=>opt(c.id,'',c.num+' '+c.call)).join('')}</select></label>
          <label>Show name<input name="series" id="iaSeries" value="${esc(IA.title)}" required></label>
          <label>Type<select name="kind" id="iaKind">${KINDS.map(k=>opt(k,'show')).join('')}</select></label>
          <label>Rating<input name="rating" id="iaRating" value="TV-PG"></label>`:''}
          ${IA.as==='movie'?`<label>Genre<input name="genre" id="iaGenre" value="Movies"></label>`:''}
          <div class="btns wide"><button class="btn go" ${n?'':'disabled'}>IMPORT ${n} \u2022 ${dur(tot)}</button></div></form>`;
    }
  }else if(tab==='settings'){
    b+=`<form class="form" id="fSet"><label>Weather town<input name="town" id="sTown" value="${esc(D.settings.town)}"></label><label>Temperature °F<input name="temp" id="sTemp" type="number" value="${esc(D.settings.temp)}"></label>
      <label class="wide">Preview window clip (YouTube, plays muted on loop)<input name="promo" id="sPromo" value="${esc(D.settings.promo)}" placeholder="Leave empty for rotating Now/Tonight cards"></label>
      <label class="wide">Guide ad lines (one per line)<textarea name="guideAds" id="sAds" rows="4">${esc(D.guideAds.join('\n'))}</textarea></label>
      <div class="btns wide"><button class="btn go">SAVE SETTINGS</button></div></form>`;
  }else{
    b+=`<p class="note">Everything is saved in this browser. Copy this backup to move it to another device or keep it safe.</p><textarea id="bOut" rows="6" readonly>${esc(JSON.stringify(D))}</textarea><div class="btns"><button class="btn" data-copy>COPY BACKUP</button></div>
      <h3>RESTORE</h3><textarea id="bIn" rows="4" placeholder="Paste a backup here"></textarea><div class="btns"><button class="btn go" data-restore>LOAD BACKUP</button><button class="btn dim" data-reset>RESET TO SAMPLE</button></div>`;
  }
  setup.innerHTML=`<div class="setup panel bevel" role="dialog" aria-label="Setup"><div class="tabs">${T.map(t=>`<button class="tab ${t===tab?'on':''}" data-tab="${t}">${t}</button>`).join('')}<button class="tab x" data-close aria-label="Close">✕</button></div><div class="sbody">${b}</div></div>`;
}
function changed(){save();renderGrid();if(!od.hidden)renderOD();renderWx();promoI=0;renderPromo();renderSetup()}
setup.addEventListener('click',e=>{
  const t=e.target;
  if(t===setup||t.closest('[data-close]'))return closeSetup();
  const d=k=>t.closest(`[data-${k}]`)?.dataset[k];
  let v;
  if((v=d('tab'))){tab=v;ed={};return renderSetup()}
  if(t.closest('[data-iaall]')){const all=IA.clips.every(c=>c.on);IA.clips.forEach(c=>c.on=!all);return renderSetup()}
  if(t.closest('[data-cancel]')){ed={};return renderSetup()}
  if((v=d('editp'))){const [c,p]=v.split('|');ed={ch:c,pid:p};renderSetup();setup.querySelector('#fProg')?.scrollIntoView({block:'start'});return}
  if((v=d('editm'))){ed={mid:v};renderSetup();setup.querySelector('#fMov')?.scrollIntoView({block:'start'});return}
  if((v=d('mv'))){const [c,i,dir]=v.split('|'),ch=chById(c),a=+i,b2=a+ +dir;if(ch&&b2>=0&&b2<ch.items.length){[ch.items[a],ch.items[b2]]=[ch.items[b2],ch.items[a]];changed()}return}
  if((v=d('ads'))){const ch=chById(v);if(ch&&!(ch.cat==='premium'||ch.ppv)){ch.noAds=!ch.noAds;changed()}return}
  if((v=d('rmp'))){const [c,i]=v.split('|');chById(c)?.items.splice(+i,1);return changed()}
  if((v=d('delch'))){const btn=t.closest('[data-delch]');if(btn.dataset.armed){D.channels=D.channels.filter(c=>c.id!==v);changed()}else{btn.dataset.armed=1;btn.textContent='Tap again to delete'}return}
  if((v=d('rmad'))!==undefined){D.ads.splice(+v,1);return changed()}
  if((v=d('rmm'))){D.movies=D.movies.filter(m=>m.id!==v);return changed()}
  if(t.closest('[data-libadd]')){const m=D.movies.find(x=>x.id===$('#libM').value),ch=chById($('#libC').value);if(m&&ch){const c=Object.assign({},m,{id:uid(),kind:'movie'});delete c.genre;ch.items.push(c);changed();toast(m.title.toUpperCase()+' ADDED TO CH '+ch.num)}return}
  if(t.closest('[data-import]')){
    const file=$('#impFile')?.files?.[0],text=$('#impText')?.value.trim(),clear=$('#impClear')?.checked;
    const run=s=>{try{const r=importArchive(JSON.parse(s),clear);changed();showView('od');closeSetup();toast(`IMPORTED ${r.added} NEW • UPDATED ${r.updated}`)}catch(err){toast('THAT FILE IS NOT AN ARCHIVE BACKUP')}};
    if(file){const fr=new FileReader();fr.onload=()=>run(fr.result);fr.onerror=()=>toast('COULD NOT READ THAT FILE');fr.readAsText(file)}
    else if(text) run(text); else toast('CHOOSE THE BACKUP FILE FIRST');
    return;
  }
  if(t.closest('[data-copy]')){const ta=$('#bOut');const done=()=>toast('BACKUP COPIED');try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();toast('SELECTED — COPY IT MANUALLY')})}catch(err){ta.select()}return}
  if(t.closest('[data-restore]')){try{const n=JSON.parse($('#bIn').value);if(!n.channels||!n.movies)throw 0;D=Object.assign(sample(),n);changed();toast('BACKUP LOADED')}catch(err){toast('THAT TEXT IS NOT A TRACKING ERROR BACKUP')}return}
  if(t.closest('[data-reset]')){const btn=t.closest('[data-reset]');if(btn.dataset.armed){D=sample();changed();toast('SAMPLE LINEUP RESTORED')}else{btn.dataset.armed=1;btn.textContent='TAP AGAIN TO ERASE EVERYTHING'}return}
});
setup.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.iac!==undefined){IA.clips[+t.dataset.iac].on=t.checked;const sb=setup.scrollTop,lb=setup.querySelector('.list')?.scrollTop;renderSetup();const l=setup.querySelector('.list');if(l)l.scrollTop=lb}
  else if(t.id==='iaAs'){IA.as=t.value;renderSetup()}
});
setup.addEventListener('submit',e=>{
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),id=e.target.id;
  if(id==='fIA'){iaLookup(f.url);return}
  if(id==='fIAimp'){const n=iaImport(f);toast(n?`IMPORTED ${n} ${f.as==='episode'?'EPISODES':f.as==='movie'?'MOVIES':f.as==='bumper'?'BUMPERS':'COMMERCIALS'}`:'NOTHING NEW TO IMPORT');changed();return}
  if(id==='fProg'){const ch=chById(f.ch);if(!ch)return;const data={title:f.title.trim(),kind:f.kind,mins:+f.mins||22,rating:f.rating.trim(),year:f.year.trim(),stars:+f.stars||0,isNew:!!f.isNew,src:f.src.trim(),desc:f.desc.trim(),cc:true};
    if(f.pid){D.channels.forEach(c=>{const i=c.items.findIndex(p=>p.id===f.pid);if(i>-1)c.items.splice(i,1)});ch.items.push(Object.assign({id:f.pid},data));toast('SAVED')}
    else{ch.items.push(Object.assign({id:uid()},data));toast(data.title.toUpperCase()+' ADDED TO CH '+ch.num)}
    ed={ch:ch.id};}
  else if(id==='fCh'){const num=+f.num;if(D.channels.some(c=>c.num===num)){toast('CHANNEL '+num+' ALREADY EXISTS');return}D.channels.push({id:uid(),num,call:f.call.trim().toUpperCase(),cat:f.cat,ppv:f.ppv.trim()||undefined,noAds:!!f.noAds,items:[]});toast('CHANNEL '+num+' ADDED')}
  else if(id==='fAd'){if(!ytId(f.src)&&!/^https?:/.test(f.src)){toast('PASTE A YOUTUBE OR VIDEO LINK');return}D.ads.push({title:f.title.trim(),src:f.src.trim(),secs:+f.secs||30});toast('COMMERCIAL ADDED')}
  else if(id==='fMov'){const data={title:f.title.trim(),year:f.year.trim(),genre:f.genre.trim()||'Movies',rating:f.rating.trim(),mins:+f.mins||100,stars:+f.stars||0,src:f.src.trim(),desc:f.desc.trim(),kind:'movie',cc:true,isNew:false};
    if(f.mid){const m=D.movies.find(x=>x.id===f.mid);if(m)Object.assign(m,data);toast('SAVED')}else{D.movies.push(Object.assign({id:uid(),mine:true},data));toast(data.title.toUpperCase()+' ADDED')}ed={}}
  else if(id==='fSet'){Object.assign(D.settings,{town:f.town.trim(),temp:f.temp===''?'':+f.temp,promo:f.promo.trim()});D.guideAds=f.guideAds.split('\n').map(s=>s.trim()).filter(Boolean);$('#preview').innerHTML='';toast('SETTINGS SAVED')}
  changed();
});

/* ---------- boot ---------- */
renderWx();renderGrid();renderPromo();tick();
setInterval(tick,1000);setInterval(()=>{if(!D.settings.promo)renderPromo()},7000);
addEventListener('resize',()=>renderGrid());
requestAnimationFrame(loop);
})();
</script>

</body>
